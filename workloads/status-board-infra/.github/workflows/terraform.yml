name: terraform

# Plans on a pull request, applies on main. Credentials come from the GitHub
# OIDC provider, so no access key is stored in this repository.
on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

# Never let two applies touch the same state at once.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

# Account-specific values come from repository variables, which
# setup/configure-repos.sh in the ai-tokenomics toolkit repository sets from
# the bootstrap outputs. The role ARN is not a secret. The trust policy on the role is what
# limits it to this repository, on main or a pull request.
env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  NAME_PREFIX: ${{ vars.NAME_PREFIX || 'tokenomics-status-board' }}
  TF_VAR_repo_name: ${{ github.event.repository.name }}
  TF_IN_AUTOMATION: "true"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
        # bash -eo pipefail. The runner default omits pipefail, which let a
        # failing `terraform plan | tee` report success.
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Check the repository variables
        env:
          ENV_NAME: ${{ vars.ENV_NAME }}
          HOSTED_ZONE_NAME: ${{ vars.HOSTED_ZONE_NAME }}
          SUBDOMAIN: ${{ vars.SUBDOMAIN }}
          CERTIFICATE_DOMAIN: ${{ vars.CERTIFICATE_DOMAIN }}
        run: |
          missing=0
          for name in AWS_ROLE_ARN TF_STATE_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable ${name} is not set. Run setup/configure-repos.sh in the ai-tokenomics repository."
              missing=1
            fi
          done
          if [ "$missing" != 0 ]; then exit 1; fi

          # Pass only the variables that are set. Terraform keeps its own
          # default for the rest, so an empty variable cannot blank a value.
          pass() {
            if [ -n "$2" ]; then
              echo "TF_VAR_$1=$2" >> "$GITHUB_ENV"
              echo "TF_VAR_$1=$2"
            fi
          }
          pass env "$ENV_NAME"
          pass hosted_zone_name "$HOSTED_ZONE_NAME"
          pass subdomain "$SUBDOMAIN"
          pass certificate_domain "$CERTIFICATE_DOMAIN"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: gha-terraform-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
          echo "### Terraform plan" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -c 60000 plan.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Posting the plan on the pull request leaves a written record of what
      # was about to change, next to the discussion of why.
      - name: Comment the plan on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Terraform plan"
            echo
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

      - name: Apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -no-color tfplan

      - name: Report the outputs
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Outputs"
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
